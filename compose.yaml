# Temple Runner — static Three.js game + tiny leaderboard API.
# Deployed on: mail.ziniewicz.eu via Komodo (stack "temple-runner", repo wzin/temple-runner).
# Routed by homecloud/traefik/dynamic/temple-runner.yml -> http://temple-runner:80.
# Caddy (web) serves the bundle and proxies /api/* to the api container over the internal network.
#
# Local development (no node on the host):
#   docker compose --profile dev up -d dev   -> http://localhost:3001 (DEV_PORT overrides); api-dev starts with it
#   docker compose --profile dev run --rm dev npm test

services:
  web:
    build: .
    container_name: temple-runner
    restart: unless-stopped
    depends_on:
      - api
    networks:
      - traefik_proxy
      - internal
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      retries: 3

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: temple-runner-api
    restart: unless-stopped
    volumes:
      - scores_data:/data
    networks:
      - internal

  dev:
    image: node:22-alpine
    profiles: ["dev"]
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0 --port 3000"
    ports:
      - "${DEV_PORT:-3001}:3000"
    environment:
      CHOKIDAR_USEPOLLING: "1"
      API_URL: http://api-dev:3002
    depends_on:
      - api-dev
    volumes:
      - .:/app
      - node_modules:/app/node_modules

  api-dev:
    image: node:22-alpine
    profiles: ["dev"]
    working_dir: /app
    command: node server/index.mjs
    environment:
      PORT: "3002"
      DB_PATH: /data/scores.db
    volumes:
      - .:/app:ro
      - scores_dev:/data

volumes:
  node_modules:
  scores_data:
  scores_dev:

networks:
  traefik_proxy:
    external: true
  internal:
