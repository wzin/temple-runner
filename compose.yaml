# Temple Runner — static Three.js game.
# Deployed on: mail.ziniewicz.eu via Komodo (stack "temple-runner", repo wzin/temple-runner).
# Routed by homecloud/traefik/dynamic/temple-runner.yml -> http://temple-runner:80.
#
# Local development (no node on the host):
#   docker compose --profile dev up dev      -> http://localhost:3001 (DEV_PORT overrides)
#   docker compose --profile dev run --rm dev npm test

services:
  web:
    build: .
    container_name: temple-runner
    restart: unless-stopped
    networks:
      - traefik_proxy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      retries: 3

  dev:
    image: node:22-alpine
    profiles: ["dev"]
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0 --port 3000"
    ports:
      - "${DEV_PORT:-3001}:3000"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    environment:
      CHOKIDAR_USEPOLLING: "1"

volumes:
  node_modules:

networks:
  traefik_proxy:
    external: true
